[project]
name = "band-workshop-demo"
version = "0.1.0"
description = "Workshop demo: two agents on the band.ai (thenvoi) platform — a LangGraph personal assistant and an Anthropic weather agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "thenvoi-sdk[langgraph,anthropic] @ git+https://github.com/thenvoi/thenvoi-sdk-python.git",
    "langchain-anthropic>=0.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.scripts]
personal-assistant = "agents.personal_assistant.main:cli"
weather-agent = "agents.weather.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.hatch.metadata]
allow-direct-references = true
